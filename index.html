<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">
    <title>Quản Lý Nhà Thuốc</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-Qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Fuse.js -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <!-- Day.js -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; background-color: #f8fafc; }
        .tab-content { display: none !important; }
        .tab-content.active { display: flex !important; }
        .safe-bottom { padding-bottom: max(60px, env(safe-area-inset-bottom)); }
        .safe-top { padding-top: max(0.5rem, env(safe-area-inset-top)); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .return-mode-bg { background-color: #fff7ed !important; border-color: #fdba74 !important; }
    </style>
</head>
<body class="text-slate-800 font-sans h-[100dvh] flex flex-col overflow-hidden relative">

    <!-- TOAST THÔNG BÁO -->
    <div id="toast" class="fixed top-12 left-1/2 transform -translate-x-1/2 z-[800] hidden px-5 py-3 rounded-full shadow-2xl text-white font-bold transition-all text-sm w-max max-w-[90%] text-center"></div>

    <!-- HỘP THOẠI XÁC NHẬN (Thay thế Confirm) -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 z-[700] flex items-center justify-center hidden p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 text-center shadow-2xl border border-slate-200">
            <div class="w-12 h-12 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            </div>
            <p id="confirm-msg" class="font-bold mb-5 text-slate-700 text-sm leading-relaxed"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirm()" class="flex-1 py-2.5 bg-slate-100 text-slate-600 rounded-xl font-bold active:bg-slate-200">Hủy</button>
                <button id="confirm-yes-btn" class="flex-1 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-md active:bg-indigo-700">Đồng ý</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="fixed inset-0 bg-slate-100 z-[200] flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-indigo-900 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white shadow-lg rotate-3">
                    <i class="fa-solid fa-notes-medical text-3xl -rotate-3"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-indigo-950">Nhà Thuốc</h1>
            </div>
            <form id="login-form" class="space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="login-id" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-600 font-medium" placeholder="Tài khoản">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="password" id="login-pass" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-600 font-medium" placeholder="Mật khẩu">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-all mt-4 text-lg">Đăng Nhập</button>
            </form>
            <div id="login-error" class="mt-4 text-red-500 text-xs font-bold hidden text-center border border-red-200 bg-red-50 p-2 rounded"></div>
        </div>
    </div>

    <!-- ỨNG DỤNG CHÍNH -->
    <div id="app-container" class="hidden h-[100dvh] flex flex-col w-full relative">
        
        <header class="bg-indigo-900 text-white px-3 py-2 safe-top flex justify-between items-center z-20 shrink-0 shadow-sm relative">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-notes-medical text-indigo-300"></i>
                <h1 class="font-bold text-sm" id="header-title">Bán Hàng</h1>
            </div>
            <div class="flex items-center gap-2 text-xs font-bold" id="mode-toggle-container">
                <span id="mode-label" class="text-indigo-200">BÁN HÀNG</span>
                <button id="btn-mode-toggle" onclick="toggleReturnMode()" class="w-10 h-5 bg-indigo-700 rounded-full relative shadow-inner">
                    <div id="mode-slider" class="w-4 h-4 bg-white rounded-full absolute left-0.5 top-0.5 transition-all"></div>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto relative bg-slate-50 z-10 hide-scroll" id="main-scroll">
            
            <!-- TAB: BÁN HÀNG -->
            <div id="tab-banhang" class="tab-content active flex-col h-full safe-bottom p-2" style="background-color: var(--bg-mode, #f8fafc);">
                
                <div class="relative z-30 mb-2 flex gap-1">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-user-tag absolute left-2.5 top-2.5 text-slate-400 text-sm"></i>
                        <input type="text" id="pos-customer-search" placeholder="Mã KH hoặc Tên..." class="w-full pl-8 pr-2 py-2 rounded-lg border border-slate-200 shadow-sm outline-none focus:ring-1 focus:ring-indigo-500 bg-white text-sm" autocomplete="off">
                    </div>
                    <button onclick="startScanner('pos-customer')" class="bg-indigo-100 text-indigo-700 px-3 rounded-lg"><i class="fa-solid fa-qrcode"></i></button>
                    <button onclick="showCustomerAdd()" class="bg-indigo-600 text-white px-3 rounded-lg"><i class="fa-solid fa-plus"></i></button>
                    <div id="pos-customer-suggest" class="absolute top-full left-0 w-full bg-white rounded-lg shadow-xl border border-slate-100 mt-1 hidden max-h-40 overflow-y-auto z-40"></div>
                </div>
                
                <div id="pos-customer-info" class="hidden bg-indigo-50 border border-indigo-100 px-2 py-1.5 rounded-lg mb-2 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-indigo-900 text-xs" id="pos-c-name"></p>
                        <p class="text-[10px] text-indigo-600 font-medium"><i class="fa-solid fa-star text-amber-400"></i> <span id="pos-c-points"></span> điểm</p>
                    </div>
                    <button onclick="removePosCustomer()" class="text-slate-400"><i class="fa-solid fa-times"></i></button>
                </div>

                <div class="relative z-20 mb-2 flex gap-1">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-sm"></i>
                        <input type="text" id="pos-product-search" placeholder="Tìm tên/mã SP..." class="w-full pl-8 pr-2 py-2 rounded-lg border border-slate-200 shadow-sm outline-none focus:ring-1 focus:ring-indigo-500 bg-white font-bold text-sm" autocomplete="off">
                    </div>
                    <button onclick="startScanner('pos-product')" class="bg-slate-800 text-white px-3 rounded-lg"><i class="fa-solid fa-barcode"></i></button>
                    <button onclick="toggleQuickAdd()" class="bg-emerald-600 text-white px-3 rounded-lg shadow-sm" title="Bán hàng ngoài kho"><i class="fa-solid fa-bolt"></i></button>
                    <div id="pos-product-suggest" class="absolute top-full left-0 w-full bg-white rounded-lg shadow-xl border border-slate-100 mt-1 hidden max-h-56 overflow-y-auto z-40"></div>
                </div>
                
                <!-- Bảng Bán Hàng Nhanh (Ngoài kho) -->
                <div id="pos-quick-add-form" class="hidden mb-2 flex gap-1 bg-emerald-50 p-1.5 rounded-lg border border-emerald-200 shadow-inner">
                    <input type="text" id="qa-name" placeholder="Tên món ngoài..." class="flex-1 px-2 py-1.5 rounded outline-none border border-emerald-200 text-sm font-medium">
                    <input type="tel" inputmode="numeric" id="qa-price" placeholder="Giá(k)" class="w-16 px-2 py-1.5 rounded outline-none border border-emerald-200 text-sm font-bold text-red-600 text-right">
                    <button onclick="addQuickItem()" class="bg-emerald-600 text-white px-3 rounded font-bold active:scale-95"><i class="fa-solid fa-plus"></i></button>
                </div>

                <div class="flex-1 overflow-y-auto hide-scroll mb-2 bg-white rounded-lg border border-slate-200 shadow-sm p-1" id="pos-cart-list">
                    <div class="h-full flex flex-col items-center justify-center text-slate-300">
                        <i class="fa-solid fa-cart-shopping text-3xl mb-1"></i><p class="text-xs">Chưa có hàng</p>
                    </div>
                </div>

                <!-- THANH TOÁN -->
                <div class="bg-white p-3 rounded-t-xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)] border border-slate-200 shrink-0">
                    <div class="flex justify-between items-center mb-1 text-sm">
                        <span class="text-slate-500 font-bold" id="txt-pos-sum">Tiền hàng:</span>
                        <span class="font-bold text-slate-800" id="pos-total">0</span>
                    </div>
                    
                    <div class="flex flex-col gap-1.5 mb-2 border-b border-dashed border-slate-200 pb-2">
                        <!-- Chế độ Bán: Trừ điểm -->
                        <div id="box-pos-discount" class="flex items-center justify-between text-indigo-600 text-xs font-medium">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" id="pos-use-points" onchange="renderCart()" class="w-4 h-4 rounded text-indigo-600">
                                <span>Trừ điểm</span>
                            </label>
                            <span id="pos-discount-amt" class="font-bold">0</span>
                        </div>
                        
                        <!-- Chế độ Bán: Giảm giá tay -->
                        <div id="box-pos-manual" class="flex items-center justify-between text-red-600 text-xs font-medium bg-red-50 p-1.5 rounded border border-red-200">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" id="pos-use-manual-discount" onchange="renderCart()" class="w-4 h-4 rounded text-red-600">
                                <span class="font-bold">Giảm thêm</span>
                            </label>
                            <div class="flex items-center gap-1">
                                <input type="tel" inputmode="numeric" id="pos-manual-discount-inp" oninput="if(document.getElementById('pos-use-manual-discount').checked) renderCart()" placeholder="Số (k)" class="w-16 px-1.5 py-1 rounded outline-none border border-red-300 text-right font-bold text-red-700 bg-white shadow-inner text-sm">
                                <span class="font-bold">k</span>
                            </div>
                        </div>

                        <!-- Chế độ Trả hàng: Cảnh báo điểm -->
                        <div id="box-pos-return-points" class="hidden items-center justify-between text-red-600 text-xs font-medium bg-red-50 p-1.5 rounded border border-red-200">
                            <span class="font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Thu hồi điểm khách:</span>
                            <span id="pos-return-points-amt" class="font-bold">0</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center mb-2">
                        <span class="text-slate-500 font-bold text-sm" id="txt-pos-final-label">Khách trả:</span>
                        <span class="font-bold text-xl text-red-600" id="pos-final">0</span>
                    </div>

                    <div class="flex gap-2 mb-2">
                        <div class="relative flex-1">
                            <input type="tel" inputmode="numeric" id="pos-cash-given" oninput="calcChange()" placeholder="Khách đưa (Nhập 100 = 100k)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-1 focus:ring-emerald-500 font-bold text-sm text-indigo-900">
                        </div>
                        <div class="bg-slate-100 px-3 py-2 rounded-lg flex items-center justify-center min-w-[80px]">
                            <span class="font-bold text-xs text-slate-600" id="pos-change-text">Thừa: 0</span>
                        </div>
                    </div>
                    <button onclick="checkout()" id="btn-checkout" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <i class="fa-solid fa-print"></i> THANH TOÁN
                    </button>
                </div>
            </div>

            <!-- TAB: NHẬP KHO -->
            <div id="tab-nhapkho" class="tab-content flex-col h-full safe-bottom p-3">
                <div class="mt-0 mb-4">
                    <h3 class="font-bold text-slate-700 text-sm mb-2"><i class="fa-solid fa-truck"></i> Đơn Đang Chờ (Từ Dự Trù)</h3>
                    <div id="pending-imports-list" class="space-y-2 max-h-32 overflow-y-auto hide-scroll"></div>
                </div>

                <div class="bg-white border border-slate-200 p-3 rounded-xl shadow-sm relative">
                    <h3 class="font-bold text-slate-700 text-sm mb-3"><i class="fa-solid fa-download"></i> Phiếu Nhập Hàng</h3>
                    
                    <div class="flex gap-2 mb-3 relative">
                        <input type="text" id="imp-search" placeholder="Gõ tên để gọi dữ liệu cũ..." class="flex-1 p-2.5 rounded-lg border border-slate-200 outline-none text-sm bg-slate-50">
                        <button onclick="startScanner('nhaphang')" class="bg-slate-800 text-white px-4 rounded-lg"><i class="fa-solid fa-barcode"></i></button>
                        <div id="imp-suggest" class="absolute top-full left-0 w-full bg-white rounded-lg shadow-xl border border-slate-100 mt-1 hidden max-h-56 overflow-y-auto z-40 text-sm"></div>
                    </div>

                    <input type="hidden" id="imp-refId">
                    <div class="space-y-2 text-sm">
                        <input type="text" id="imp-name" placeholder="Tên sản phẩm *" class="w-full p-2.5 border border-slate-200 rounded-lg font-bold" required>
                        <div class="flex gap-2">
                            <input type="text" id="imp-barcode" placeholder="Mã vạch (Để trống tự sinh mã)" class="flex-1 p-2.5 border border-slate-200 rounded-lg text-xs">
                            <button onclick="generateRandomBarcode('imp-barcode', 'SP')" class="bg-slate-200 px-3 rounded-lg" title="Tạo mã ngẫu nhiên"><i class="fa-solid fa-dice"></i></button>
                        </div>
                        
                        <div class="bg-slate-50 p-2 rounded-lg border border-slate-200">
                            <p class="text-[10px] font-bold text-slate-500 mb-1">Quy đổi (Hộp > Vỉ > Viên)</p>
                            <div class="flex items-center gap-1 mb-2">
                                <input type="text" id="imp-u1" placeholder="Hộp" class="w-10 p-1.5 border rounded text-xs text-center font-bold text-indigo-700" value="Hộp">
                                <span class="text-slate-400 text-xs">=</span>
                                <input type="tel" inputmode="numeric" id="imp-c12" placeholder="SL" class="w-10 p-1.5 border rounded text-xs text-center" value="1">
                                <input type="text" id="imp-u2" placeholder="Vỉ" class="w-10 p-1.5 border rounded text-xs text-center font-bold text-indigo-700" value="Vỉ">
                                <span class="text-slate-400 text-xs">=</span>
                                <input type="tel" inputmode="numeric" id="imp-c23" placeholder="SL" class="w-10 p-1.5 border rounded text-xs text-center" value="1">
                                <input type="text" id="imp-u3" placeholder="Viên" class="w-10 p-1.5 border rounded text-xs text-center font-bold text-indigo-700" value="Viên">
                            </div>
                            <div class="flex gap-1">
                                <input type="tel" inputmode="numeric" id="imp-p1" placeholder="Giá Hộp" class="w-1/3 p-2 border rounded text-xs text-center text-red-600 font-bold bg-white">
                                <input type="tel" inputmode="numeric" id="imp-p2" placeholder="Giá Vỉ" class="w-1/3 p-2 border rounded text-xs text-center text-red-600 font-bold bg-white">
                                <input type="tel" inputmode="numeric" id="imp-p3" placeholder="Giá Viên" class="w-1/3 p-2 border rounded text-xs text-center text-red-600 font-bold bg-white">
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <input type="tel" inputmode="numeric" id="imp-qty" placeholder="SL Nhập (Hộp) *" class="w-1/2 p-2.5 border border-slate-200 rounded-lg font-bold text-blue-600">
                            <input type="tel" inputmode="numeric" id="imp-hsd" placeholder="HSD: 150824" class="w-1/2 p-2.5 border border-slate-200 rounded-lg" oninput="formatHSD(this)">
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button onclick="fillImportForm({})" class="w-1/3 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-lg text-xs">LÀM MỚI</button>
                            <button onclick="saveImportData()" class="w-2/3 bg-indigo-600 text-white font-bold py-2.5 rounded-lg shadow-md active:scale-95">LƯU KHO LÔ NÀY</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB: TỒN KHO -->
            <div id="tab-tonkho" class="tab-content flex-col h-full safe-bottom p-3">
                <div class="flex gap-2 mb-3">
                    <input type="text" id="filter-tonkho" oninput="renderInventory()" placeholder="Tìm tên/mã..." class="flex-1 p-2.5 rounded-lg border border-slate-200 shadow-sm outline-none text-sm">
                    <button onclick="startScanner('tonkho')" class="bg-indigo-600 text-white
